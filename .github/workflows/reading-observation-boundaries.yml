name: Reading observation boundaries acceptance
on:
  push:
    branches:
      - main
      - 'reading-boundaries-*'
    paths:
      - 'app/**'
      - 'mobile app/lib/**'
      - 'mobile app/test/**'
      - 'database/**'
      - 'resources/views/pdf/invoice.blade.php'
      - 'tests/Feature/ReadingPeriodInvoiceConsistencyTest.php'
      - '.github/workflows/reading-observation-boundaries.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-sqlite:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php -l app/Services/ReadingService.php && php -l app/Services/InvoiceService.php && php -l app/Http/Controllers/Api/ReadingController.php
      - name: Focused reading and invoice regression
        run: php artisan test tests/Feature/ReadingPeriodInvoiceConsistencyTest.php
      - name: Full Laravel regression
        run: php artisan test
  mysql-period:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: water_test
          MYSQL_USER: water
          MYSQL_PASSWORD: ci_water_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water
      DB_PASSWORD: ci_water_only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, mysqli, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php artisan migrate:fresh --force --no-interaction
      - name: MySQL reading and invoice regression
        run: php artisan test tests/Feature/ReadingPeriodInvoiceConsistencyTest.php

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'mobile app'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter packages
        run: flutter pub get
      - name: Analyze Flutter sources
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test Flutter period calculation
        run: flutter test --no-pub test/core/utils/date_period_calculator_test.dart test/features/readings/data/models/reading_test.dart
