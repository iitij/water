name: G11 Drift offline queue scoped ownership
on:
  pull_request:
    types: [opened, synchronize]
    branches: ['integration/accounting-candidate-v2']
    paths: ['.github/workflows/round42-drift-queue-ownership.yml']
permissions:
  contents: read
jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/central-drift-queue-ownership'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ae24ef618861fb375eeae1c942894d2069072f9b
          persist-credentials: false
      - name: Exact source and ordinary writer inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ae24ef618861fb375eeae1c942894d2069072f9b'
          test -z "$(git status --porcelain)"
          test ! -e .env && test ! -e .env.testing
          echo "SEQUENCE_CALLS"
          git grep -n -E 'generateBillNumber|generateReceiptNumber|Invoice::create\(|Payment::create\(|new Invoice\(|new Payment\(' -- app routes database || test "$?" -eq 1
          echo "DOCUMENT_IDENTIFIER_WRITER_FILES"
          git grep -l -E 'bill_number|receipt_number' -- app routes database || test "$?" -eq 1
          echo "LATE_RECEIPT_REVIEW_REFERENCES"
          git grep -l 'late_receipt_reviews' -- app routes database || test "$?" -eq 1
          echo "TEST_GENERATOR_CALLS"
          git grep -n -E 'generateBillNumber|generateReceiptNumber' -- tests || test "$?" -eq 1
          git diff --exit-code
  flutter:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ae24ef618861fb375eeae1c942894d2069072f9b
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          ini-values: serialize_precision=-1
          coverage: none
          tools: composer:2.9.8
      - name: Verify exact source and locked Laravel translation dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ae24ef618861fb375eeae1c942894d2069072f9b'
          test -z "$(git status --porcelain)"
          test ! -e .env && test ! -e .env.testing
          printf '%s\n' \
            '62931ebaf0deb4de748ffefd94264b3de48d15a9e2d1d4a0702f4a1c6cf39335  composer.lock' \
            '4e49440cc7ed97bf3efa59fca5a4d892f89f9531bda9173ad5ad84777945ddd3  package-lock.json' \
            '1fe487ad38dcb6d977b4fa11aad22d3aa8edd6c8e467b2652634d6b1a5fb314d  mobile app/pubspec.lock' | sha256sum --check
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          composer check-platform-reqs
          php artisan package:discover --ansi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: false
      - name: Enforce Flutter and Dart versions and locked dependencies
        working-directory: 'mobile app'
        shell: bash
        run: |
          set -euo pipefail
          flutter --version --machine > "$RUNNER_TEMP/flutter-version.json"
          cat "$RUNNER_TEMP/flutter-version.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["frameworkVersion"]=="3.44.0" and d["dartSdkVersion"]=="3.12.0"' "$RUNNER_TEMP/flutter-version.json"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Strict analyzer and Drift ownership regressions
        working-directory: 'mobile app'
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub --concurrency=1 test/features/offline_sync/ test/core/backup/database_restore_guard_test.dart
          git diff --exit-code
          test -z "$(git status --porcelain)"
