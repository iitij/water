name: Water | Backup settings acceptance
on:
  push:
    branches: [main]
    paths:
      - 'app/Support/BackupControl.php'
      - 'app/Console/Commands/Backup*.php'
      - 'app/Filament/Pages/BackupSettings.php'
      - 'config/water-backup.php'
      - 'resources/views/filament/pages/backup-settings.blade.php'
      - 'tests/Feature/BackupControlTest.php'
      - '.github/workflows/backup-settings-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Install locked dependencies
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          touch .env
          composer install --no-interaction --no-progress --prefer-dist
      - name: Verify settings page, authorization, scheduler and device receipts
        run: php artisan test tests/Feature/BackupControlTest.php tests/Feature/ProfessionalFilamentUiTest.php
