name: Water | Namecheap remote operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Select a controlled hosting operation'
        required: true
        default: audit
        type: choice
        options:
          - audit
          - diagnose
          - selector-status
          - php-readiness
          - composer-setup
          - composer-install
          - laravel-preflight
          - prepare-storage
          - init-env
          - database-audit
          - database-schema-audit
          - database-engine-audit
          - migrate-empty
          - sync

permissions:
  contents: read

concurrency:
  group: water-namecheap-remote
  cancel-in-progress: false

jobs:
  remote:
    name: Run on Namecheap
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'iitij' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure SSH key and verify host identity
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_PRIVATE_KEY}" ]]; then
            echo "::error::Missing NAMECHEAP_SSH_PRIVATE_KEY repository secret."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/namecheap_ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/namecheap_ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/namecheap_ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/namecheap_ssh/id_ed25519" >/dev/null

          # Key observed when the owner first connected to the Namecheap server.
          # Confirm it out-of-band with Namecheap before relying on it.
          expected='SHA256:30IXGrYxD3pXnfOdvFZMCJ5YShzaMeRCYXRWXYnl4Rw'
          ssh-keyscan -T 15 -p 21098 -t ed25519 66.29.146.205             > "$RUNNER_TEMP/namecheap_ssh/known_hosts" 2>/dev/null
          actual="$(ssh-keygen -lf "$RUNNER_TEMP/namecheap_ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Namecheap SSH host fingerprint mismatch. Aborting."
            exit 1
          fi

      - name: Perform requested operation (never as root)
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            audit|diagnose|selector-status|php-readiness|composer-setup|composer-install|laravel-preflight|prepare-storage|init-env|database-audit|database-schema-audit|database-engine-audit|migrate-empty|sync) ;;
            *) echo "::error::Unsupported operation"; exit 1 ;;
          esac
          ssh -T -p 21098 \
            -i "$RUNNER_TEMP/namecheap_ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/namecheap_ssh/known_hosts" \
            -o ConnectTimeout=20 \
            alweufti@66.29.146.205 "bash -se -- $OPERATION" <<'REMOTE_SCRIPT'
          set -euo pipefail

          operation="${1:?missing operation}"
          project="$HOME/repositories/water"
          if [[ "$(id -un)" != "alweufti" ]]; then
            echo 'Refusing to run under unexpected account.'
            exit 1
          fi
          if [[ ! -d "$project/.git" ]]; then
            echo 'Repository not cloned in the expected location.'
            exit 1
          fi

          echo "Operation: $operation"
          echo "Account: $(id -un)"
          echo "Host: $(hostname)"
          echo "Project: $project"
          cd "$project"
          test "$(git remote get-url origin)" = "git@github.com:iitij/water.git"
          test "$(git branch --show-current)" = main

          case "$operation" in
            audit)
              echo '=== GIT ==='
              git status --short
              git rev-parse HEAD
              echo '=== PHP 8.4 ==='
              /opt/alt/php84/usr/bin/php -v | head -n 1
              echo '=== REQUIRED PHP EXTENSIONS ==='
              /opt/alt/php84/usr/bin/php -r '
                foreach (["bcmath","ctype","curl","dom","fileinfo","gd","intl","mbstring","openssl","pdo_mysql","tokenizer","xml","zip"] as $name) {
                  echo $name, ": ", extension_loaded($name) ? "OK" : "MISSING", PHP_EOL;
                }'
              echo '=== TOOLS ==='
              for tool in composer node npm; do
                if command -v "$tool" >/dev/null 2>&1; then
                  command -v "$tool"
                else
                  echo "$tool: NOT IN PATH"
                fi
              done
              echo '=== DISK SPACE ==='
              df -h "$HOME"
              ;;
            diagnose)
              php84="/opt/alt/php84/usr/bin/php"
              echo '=== PHP CONFIGURATION ==='
              "$php84" -r '
                echo "PHP Version: ", PHP_VERSION, PHP_EOL;
                echo "Loaded php.ini: ", php_ini_loaded_file() ?: "NONE", PHP_EOL;
                echo "Scanned additional INI: ", php_ini_scanned_files() ?: "NONE", PHP_EOL;
                echo "Extension directory: ", ini_get("extension_dir"), PHP_EOL;
              '
              echo '=== PHP EXTENSION FILE AVAILABILITY ==='
              ext_dir="$("$php84" -r 'echo ini_get("extension_dir");')"
              if [[ -d "$ext_dir" ]]; then
                for mod in bcmath dom fileinfo gd intl mbstring zip; do
                  if [[ -f "$ext_dir/$mod.so" ]]; then
                    echo "$mod: module file available, NOT necessarily enabled"
                  else
                    echo "$mod: no directly named module file"
                  fi
                done
              else
                echo 'Extension directory not readable.'
              fi
              echo '=== PHP CONFIGURATION TOOLS ==='
              for tool in selectorctl php-selector cloudlinux-selector composer composer2 node npm; do
                if command -v "$tool" >/dev/null 2>&1; then
                  command -v "$tool"
                else
                  echo "$tool: NOT IN PATH"
                fi
              done
              echo '=== POSSIBLE COMPOSER EXECUTABLES ==='
              for bin in /opt/cpanel/composer/bin/composer /usr/local/bin/composer /usr/bin/composer "$HOME/composer.phar"; do
                if [[ -f "$bin" ]]; then
                  echo "$bin (file exists)"
                fi
              done
              echo '=== CONCLUSION ==='
              echo 'Read-only diagnostic only; no runtime settings changed.'
              ;;
            selector-status)
              echo '=== PHP SELECTOR SUMMARY ==='
              selectorctl --user-summary --user=alweufti || true
              echo '=== PHP 8.4 EXTENSION SETTINGS ==='
              selectorctl --list-user-extensions --version=8.4 --user=alweufti --all || true
              echo '=== PHP SELECTOR CURRENT ==='
              selectorctl --user-current --user=alweufti || true
              echo '=== READ ONLY ==='
              echo 'No settings changed.'
              ;;
            php-readiness)
              echo '=== PHP 8.4 READINESS ==='
              /opt/alt/php84/usr/bin/php -r '
                $required = ["bcmath","ctype","curl","dom","fileinfo","gd","intl",
                             "mbstring","openssl","pdo_mysql","tokenizer","xml","zip"];
                $missing = [];
                foreach ($required as $ext) {
                  $ok = extension_loaded($ext);
                  echo $ext, ": ", $ok ? "OK" : "MISSING", PHP_EOL;
                  if (!$ok) $missing[] = $ext;
                }
                echo "PHP version: ", PHP_VERSION, PHP_EOL;
                if (version_compare(PHP_VERSION, "8.3", "<") || $missing) {
                  fwrite(STDERR, "PHP runtime not ready for Water.\n");
                  exit(1);
                }
              '
              echo 'PHP 8.4 module preflight passed.'
              ;;
            composer-setup)
              echo '=== SECURE COMPOSER 2 INSTALL FOR CPANEL USER ==='
              php84='/opt/alt/php84/usr/bin/php'
              "$php84" -r '
                if (version_compare(PHP_VERSION, "8.3", "<")) exit(1);
                foreach (["phar","openssl","curl","mbstring"] as $ext) {
                  if (!extension_loaded($ext)) { fwrite(STDERR, "Missing PHP extension: $ext\\n"); exit(1); }
                }
              '
              command -v curl >/dev/null 2>&1 || { echo 'curl binary is required.'; exit 1; }
              tmp_dir="$(mktemp -d)"
              trap 'rm -rf "$tmp_dir"' EXIT
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                https://getcomposer.org/installer -o "$tmp_dir/composer-setup.php"
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                https://composer.github.io/installer.sig -o "$tmp_dir/installer.sig"
              expected="$(tr -d '[:space:]' < "$tmp_dir/installer.sig")"
              [[ "$expected" =~ ^[a-fA-F0-9]{96}$ ]] || {
                echo 'Invalid official Composer signature; aborting.'
                exit 1
              }
              actual="$("$php84" -r 'echo hash_file("sha384", $argv[1]);' "$tmp_dir/composer-setup.php")"
              [[ "${actual,,}" == "${expected,,}" ]] || {
                echo 'Composer installer signature mismatch; aborting.'
                exit 1
              }
              install_dir="$HOME/.local/bin"
              mkdir -p "$install_dir"
              if [[ -e "$install_dir/composer" ]]; then
                echo 'Composer already exists in user-local directory. Not replacing.'
              else
                "$php84" "$tmp_dir/composer-setup.php" --2 --install-dir="$install_dir" --filename=composer
              fi
              echo '=== VERIFIED COMPOSER VERSION ==='
              "$php84" "$install_dir/composer" --version
              echo 'Composer installed for the cPanel user only; no Laravel scripts or migrations executed.'
              ;;
            composer-install)
              echo '=== INSTALL LOCKED LARAVEL PRODUCTION DEPENDENCIES ==='
              php84='/opt/alt/php84/usr/bin/php'
              composer_bin="$HOME/.local/bin/composer"
              test -f "$composer_bin"
              test -s composer.lock
              test -s composer.json
              if [[ -n "$(git status --porcelain)" ]]; then
                echo 'Project checkout has uncommitted changes; aborting.'
                exit 1
              fi
              if [[ -e vendor ]]; then
                echo 'Existing vendor directory detected; refusing to overwrite it in this first-install operation.'
                exit 1
              fi
              export COMPOSER_NO_INTERACTION=1
              export COMPOSER_HOME="$HOME/.cache/water-composer-home"
              export COMPOSER_CACHE_DIR="$HOME/.cache/water-composer-cache"
              mkdir -p "$COMPOSER_HOME" "$COMPOSER_CACHE_DIR"
              "$php84" "$composer_bin" validate --no-check-publish
              "$php84" "$composer_bin" install \
                --no-dev --no-scripts --no-plugins --no-progress \
                --prefer-dist --optimize-autoloader --no-interaction
              "$php84" "$composer_bin" check-platform-reqs --no-dev
              test -s vendor/autoload.php
              echo '=== INSTALLED DEPENDENCIES ==='
              "$php84" "$composer_bin" --version
              echo 'Production vendor directory created for the current server checkout.'
              echo 'No Artisan command, Composer plugin, scripts, database migration, or public deployment executed.'
              ;;
            laravel-preflight)
              echo '=== LARAVEL RUNTIME PRE-FLIGHT: READ-ONLY ==='
              php84='/opt/alt/php84/usr/bin/php'
              echo '=== CURRENT REPOSITORY ==='
              git rev-parse HEAD
              if [[ -n "$(git status --porcelain)" ]]; then
                echo 'Working tree has local changes.'
              else
                echo 'Working tree is clean.'
              fi
              echo '=== FILE AND DIRECTORY STATUS ==='
              for item in artisan composer.json composer.lock vendor/autoload.php bootstrap/cache storage/framework storage/logs public/index.php public/build/manifest.json; do
                if [[ -e "$item" ]]; then
                  echo "$item: FOUND"
                else
                  echo "$item: NOT FOUND"
                fi
              done
              for dir in bootstrap/cache storage storage/framework storage/logs; do
                if [[ -d "$dir" && -w "$dir" ]]; then
                  echo "$dir: WRITABLE"
                else
                  echo "$dir: NOT WRITABLE OR MISSING"
                fi
              done
              echo '=== APPLICATION SETTINGS PRESENCE (NO VALUES) ==='
              if [[ -f .env ]]; then
                echo '.env: PRESENT'
                for key in APP_KEY APP_ENV APP_DEBUG APP_URL DB_CONNECTION; do
                  if grep -Eq "^${key}=.+" .env; then
                    echo "$key: SET"
                  else
                    echo "$key: MISSING OR EMPTY"
                  fi
                done
              else
                echo '.env: MISSING'
              fi
              if [[ -e public/hot ]]; then
                echo 'WARNING: public/hot exists (development server marker).'
              fi
              echo '=== RUNTIME STATUS ==='
              "$php84" -r 'echo "PHP: ", PHP_VERSION, PHP_EOL;'
              "$php84" -l artisan
              echo 'No Artisan boot, env value disclosure, migrations, database access, or deployment performed.'
              ;;
            prepare-storage)
              echo '=== PREPARE LARAVEL RUNTIME DIRECTORIES ==='
              if [[ -L storage || -L bootstrap/cache ]]; then
                echo 'Unexpected symbolic link in runtime paths; aborting.'
                exit 1
              fi
              umask 027
              for dir in storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views storage/framework/testing bootstrap/cache; do
                if [[ -L "$dir" ]]; then
                  echo "Refusing symbolic link: $dir"
                  exit 1
                fi
                mkdir -p "$dir"
                if [[ ! -w "$dir" ]]; then
                  echo "Runtime directory not writable: $dir"
                  exit 1
                fi
                echo "$dir: READY"
              done
              echo 'Runtime directories prepared. No env creation, Artisan boot, database access, or public deployment.'
              ;;
            init-env)
              echo '=== INITIALIZE PRIVATE LARAVEL ENVIRONMENT ==='
              if [[ -e .env || -L .env ]]; then
                echo '.env already exists. Refusing to overwrite it.'
                exit 1
              fi
              php84='/opt/alt/php84/usr/bin/php'
              app_key="$("$php84" -r 'echo "base64:", base64_encode(random_bytes(32));')"
              umask 077
              temp_env="$(mktemp "$project/.env.init.XXXXXXXX")"
              trap 'rm -f "$temp_env"' EXIT
              {
                printf 'APP_NAME=Water\n'
                printf 'APP_ENV=production\n'
                printf 'APP_KEY=%s\n' "$app_key"
                printf 'APP_DEBUG=false\n'
                printf 'APP_URL=https://alweshah.online\n'
                printf 'LOG_CHANNEL=single\nLOG_LEVEL=warning\n'
                printf 'CACHE_STORE=file\nSESSION_DRIVER=file\nQUEUE_CONNECTION=sync\n'
                printf 'BROADCAST_CONNECTION=log\nFILESYSTEM_DISK=local\n'
                printf 'DB_CONNECTION=mysql\nDB_HOST=localhost\nDB_PORT=3306\n'
                printf 'DB_DATABASE=\nDB_USERNAME=\nDB_PASSWORD=\n'
              } > "$temp_env"
              chmod 600 "$temp_env"
              if [[ -e .env || -L .env ]]; then
                echo '.env appeared before installation. Refusing to overwrite it.'
                exit 1
              fi
              mv --no-clobber "$temp_env" .env
              if [[ ! -s .env ]]; then
                echo 'Failed to initialize .env.'
                exit 1
              fi
              if ! grep -q '^APP_KEY=base64:' .env || ! grep -q '^APP_DEBUG=false$' .env; then
                echo 'Created file failed basic checks.'
                exit 1
              fi
              echo '.env created with production-safe application defaults and a generated encryption key.'
              echo 'Database credentials are intentionally empty; database is NOT connected.'
              echo 'No secrets printed; no Artisan commands, database access, or web deployment executed.'
              ;;
            database-audit)
              echo '=== READ-ONLY CPANEL MYSQL INVENTORY ==='
              if [[ -x /usr/local/cpanel/bin/uapi ]]; then
                uapi_bin='/usr/local/cpanel/bin/uapi'
              elif command -v uapi >/dev/null 2>&1; then
                uapi_bin="$(command -v uapi)"
              else
                echo 'CPANEL_UAPI: NOT AVAILABLE'
                exit 1
              fi
              php84='/opt/alt/php84/usr/bin/php'
              scratch="$(mktemp -d)"
              trap 'rm -rf "$scratch"' EXIT
              echo 'CPANEL_UAPI: AVAILABLE'
              query_inventory() {
                local function_name="$1"
                local label="$2"
                local mode code
                for mode in implicit-user explicit-user; do
                  if [[ "$mode" == implicit-user ]]; then
                    if "$uapi_bin" --output=json Mysql "$function_name" > "$scratch/out" 2> "$scratch/err"; then
                      code=0
                    else
                      code=$?
                    fi
                  else
                    if "$uapi_bin" --user=alweufti --output=json Mysql "$function_name" > "$scratch/out" 2> "$scratch/err"; then
                      code=0
                    else
                      code=$?
                    fi
                  fi
                  echo "$label / $mode / process-exit: $code"
                  if [[ "$code" -eq 0 ]] && "$php84" -r '
                    $data = json_decode(file_get_contents($argv[1]), true);
                    $result = is_array($data) ? ($data["result"] ?? null) : null;
                    if (!is_array($result) || ($result["status"] ?? 0) != 1 ||
                        !is_array($result["data"] ?? null)) exit(1);
                    echo $argv[2], "_COUNT: ", count($result["data"]), PHP_EOL;
                  ' "$scratch/out" "$label"; then
                    echo "$label: INVENTORY_SUCCEEDED"
                    return 0
                  fi
                  "$php84" -r '
                    $all = strtolower(file_get_contents($argv[1]) . " " . file_get_contents($argv[2]));
                    $patterns = [
                      "permission" => "/permission denied|access denied|not permitted|not authorized|unauthorized/",
                      "missing_component" => "/not found|no such file|can.t locate|unknown function|unknown module/",
                      "account" => "/invalid user|unknown user|user does not exist|no such user/",
                      "execution" => "/cannot execute|exec format|failed to execute|fork:|cannot run/",
                      "api_error" => "/error|failed|exception|unable to/",
                    ];
                    $class = "unclassified";
                    foreach ($patterns as $name => $pattern) {
                      if (preg_match($pattern, $all)) { $class = $name; break; }
                    }
                    $out = json_decode(file_get_contents($argv[1]), true);
                    $format = is_array($out) ? "json" : "non_json";
                    echo $argv[3], ": RESPONSE_", $format, ", ERROR_CLASS_", $class, PHP_EOL;
                  ' "$scratch/out" "$scratch/err" "$label"
                done
                return 1
              }
              failed=0
              query_inventory list_databases DATABASE || failed=1
              query_inventory list_users DATABASE_USER || failed=1
              echo 'Only counts and categorized error signals were printed, never identifiers or credentials.'
              echo 'No database connections, changes, imports, or migrations performed.'
              if [[ "$failed" -ne 0 ]]; then
                echo 'Database inventory is incomplete. See sanitized error classifications above.'
                exit 1
              fi
              ;;
            database-schema-audit)
              echo '=== READ-ONLY WATER MYSQL SCHEMA AUDIT ==='
              php84='/opt/alt/php84/usr/bin/php'
              test -s .env || { echo 'Laravel .env missing.'; exit 1; }
              test -s vendor/autoload.php || { echo 'Laravel vendor/autoload.php missing.'; exit 1; }
              "$php84" -r '
                require "vendor/autoload.php";
                try {
                  $raw = file_get_contents(".env");
                  if (!is_string($raw)) throw new RuntimeException("env-read");
                  $env = \Dotenv\Dotenv::parse($raw);
                  foreach (["DB_CONNECTION", "DB_HOST", "DB_PORT", "DB_DATABASE", "DB_USERNAME", "DB_PASSWORD"] as $key) {
                    if (!isset($env[$key]) || $env[$key] === "") throw new RuntimeException("env-incomplete");
                  }
                  if ($env["DB_CONNECTION"] !== "mysql" ||
                      $env["DB_DATABASE"] !== "alweufti_water" ||
                      $env["DB_USERNAME"] !== "alweufti_water") {
                    throw new RuntimeException("unexpected-database");
                  }
                  $pdo = new PDO(
                    "mysql:host={$env["DB_HOST"]};port={$env["DB_PORT"]};dbname={$env["DB_DATABASE"]};charset=utf8mb4",
                    $env["DB_USERNAME"],
                    $env["DB_PASSWORD"],
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 8]
                  );
                  if ($pdo->query("SELECT DATABASE()")->fetchColumn() !== "alweufti_water") {
                    throw new RuntimeException("wrong-database");
                  }
                  $tables = (int) $pdo->query(
                    "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = " . $pdo->quote("BASE TABLE")
                  )->fetchColumn();
                  $views = (int) $pdo->query(
                    "SELECT COUNT(*) FROM information_schema.views WHERE table_schema = DATABASE()"
                  )->fetchColumn();
                  $hasMigrations = (int) $pdo->query(
                    "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = " . $pdo->quote("migrations")
                  )->fetchColumn() > 0;
                  echo "DATABASE_CONNECTION: OK", PHP_EOL;
                  echo "BASE_TABLE_COUNT: ", $tables, PHP_EOL;
                  echo "VIEW_COUNT: ", $views, PHP_EOL;
                  echo "LARAVEL_MIGRATIONS_TABLE: ", $hasMigrations ? "PRESENT" : "ABSENT", PHP_EOL;
                  if ($hasMigrations) {
                    echo "APPLIED_MIGRATION_COUNT: ", (int) $pdo->query("SELECT COUNT(*) FROM migrations")->fetchColumn(), PHP_EOL;
                  }
                  echo "SCHEMA_EMPTY: ", ($tables === 0 && $views === 0) ? "YES" : "NO", PHP_EOL;
                  echo "SCHEMA_AUDIT: READ_ONLY", PHP_EOL;
                } catch (Throwable $e) {
                  fwrite(STDERR, "SCHEMA_AUDIT: FAILED (database connectivity or metadata unavailable).\n");
                  exit(1);
                }
              '
              echo 'No database migrations, imports, row changes, or web deployment performed.'
              ;;
            database-engine-audit)
              echo '=== MYSQL ENGINE AND PARTIAL SCHEMA AUDIT (READ ONLY) ==='
              php84='/opt/alt/php84/usr/bin/php'
              "$php84" -d display_errors=0 -r '
                try {
                  require "vendor/autoload.php";
                  $env = \Dotenv\Dotenv::parse(file_get_contents(".env"));
                  if (($env["DB_CONNECTION"] ?? "") !== "mysql" ||
                      ($env["DB_DATABASE"] ?? "") !== "alweufti_water" ||
                      ($env["DB_USERNAME"] ?? "") !== "alweufti_water" ||
                      ($env["DB_HOST"] ?? "") !== "localhost") {
                    throw new RuntimeException("unexpected-config");
                  }
                  $pdo = new PDO(
                    "mysql:host=localhost;port=3306;dbname=alweufti_water;charset=utf8mb4",
                    $env["DB_USERNAME"], $env["DB_PASSWORD"],
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 8]
                  );
                  if ($pdo->query("SELECT DATABASE()")->fetchColumn() !== "alweufti_water") {
                    throw new RuntimeException("wrong-database");
                  }
                  echo "MYSQL_VERSION: ", $pdo->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;
                  echo "DEFAULT_ENGINE: ", $pdo->query("SELECT @@SESSION.default_storage_engine")->fetchColumn(), PHP_EOL;
                  foreach ($pdo->query("SHOW ENGINES")->fetchAll(PDO::FETCH_ASSOC) as $engine) {
                    if (in_array(strtolower($engine["Engine"]), ["innodb","myisam","aria"], true)) {
                      echo "ENGINE: ", $engine["Engine"], " | SUPPORT: ", $engine["Support"], PHP_EOL;
                    }
                  }
                  foreach (["innodb_page_size","innodb_default_row_format","sql_mode"] as $name) {
                    $q = $pdo->query("SHOW VARIABLES WHERE Variable_name = " . $pdo->quote($name));
                    $value = $q->fetch(PDO::FETCH_NUM);
                    if ($value) echo strtoupper($name), ": ", $value[1], PHP_EOL;
                  }
                  $tables = $pdo->query(
                    "SELECT TABLE_NAME, ENGINE, ROW_FORMAT, TABLE_COLLATION, TABLE_TYPE FROM information_schema.tables WHERE table_schema = DATABASE() ORDER BY TABLE_NAME"
                  )->fetchAll(PDO::FETCH_ASSOC);
                  echo "SCHEMA_OBJECTS: ", count($tables), PHP_EOL;
                  foreach ($tables as $table) {
                    echo "TABLE: ", $table["TABLE_NAME"], " | ENGINE: ", $table["ENGINE"],
                      " | ROW_FORMAT: ", $table["ROW_FORMAT"], " | COLLATION: ", $table["TABLE_COLLATION"],
                      " | TYPE: ", $table["TABLE_TYPE"], PHP_EOL;
                    if ($table["TABLE_TYPE"] === "BASE TABLE" &&
                        in_array($table["TABLE_NAME"], ["migrations","users","password_reset_tokens","sessions"], true)) {
                      $name = $table["TABLE_NAME"];
                      echo "ROW_COUNT ", $name, ": ", (int) $pdo->query("SELECT COUNT(*) FROM " . $name)->fetchColumn(), PHP_EOL;
                    }
                  }
                  echo "ENGINE_AUDIT: COMPLETE; READ_ONLY", PHP_EOL;
                } catch (Throwable $e) {
                  fwrite(STDERR, "ENGINE_AUDIT: FAILED (configuration, connection, or metadata error).\n");
                  exit(1);
                }
              '
              ;;
            migrate-empty)
              echo '=== INITIALIZE VERIFIED EMPTY WATER DATABASE ==='
              php84='/opt/alt/php84/usr/bin/php'
              test -s .env || { echo 'Missing private Laravel env.'; exit 1; }
              test -s vendor/autoload.php || { echo 'Missing installed Laravel dependencies.'; exit 1; }
              if [[ -n "$(git status --porcelain)" ]]; then
                echo 'Working tree has changes; aborting migrations.'
                exit 1
              fi
              if [[ "$(find database/migrations -maxdepth 1 -type f -name '*.php' | wc -l)" -lt 45 ]]; then
                echo 'Unexpectedly few migration files; aborting.'
                exit 1
              fi
              "$php84" -r '
                require "vendor/autoload.php";
                try {
                  $text = file_get_contents(".env");
                  if (!is_string($text)) throw new RuntimeException("missing-env");
                  $env = \Dotenv\Dotenv::parse($text);
                  foreach (["DB_CONNECTION","DB_HOST","DB_PORT","DB_DATABASE","DB_USERNAME","DB_PASSWORD","APP_KEY"] as $key) {
                    if (!isset($env[$key]) || $env[$key] === "") throw new RuntimeException("missing-setting");
                  }
                  if ($env["DB_CONNECTION"] !== "mysql" ||
                      $env["DB_DATABASE"] !== "alweufti_water" ||
                      $env["DB_USERNAME"] !== "alweufti_water" ||
                      ($env["APP_ENV"] ?? "") !== "production" ||
                      ($env["APP_DEBUG"] ?? "") !== "false") {
                    throw new RuntimeException("unexpected-settings");
                  }
                  $db = new PDO(
                    "mysql:host={$env["DB_HOST"]};port={$env["DB_PORT"]};dbname={$env["DB_DATABASE"]};charset=utf8mb4",
                    $env["DB_USERNAME"],
                    $env["DB_PASSWORD"],
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 8]
                  );
                  if ($db->query("SELECT DATABASE()")->fetchColumn() !== "alweufti_water") {
                    throw new RuntimeException("wrong-database");
                  }
                  $count = (int) $db->query(
                    "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE()"
                  )->fetchColumn();
                  echo "EXISTING_DATABASE_OBJECTS: ", $count, PHP_EOL;
                  if ($count !== 0) throw new RuntimeException("nonempty-schema");
                  echo "EMPTY_SCHEMA_GUARD: PASSED", PHP_EOL;
                } catch (Throwable $e) {
                  fwrite(STDERR, "EMPTY_SCHEMA_GUARD: FAILED; NO MIGRATIONS STARTED.\n");
                  exit(1);
                }
              '
              echo '=== LARAVEL BOOTSTRAP CHECK ==='
              "$php84" artisan --version
              echo '=== CREATE SCHEMA USING EXISTING PROJECT MIGRATIONS ==='
              "$php84" artisan migrate --force --no-interaction
              echo '=== POST-MIGRATION VERIFICATION ==='
              "$php84" artisan migrate:status --no-interaction
              "$php84" -r '
                require "vendor/autoload.php";
                try {
                  $env = \Dotenv\Dotenv::parse(file_get_contents(".env"));
                  $pdo = new PDO(
                    "mysql:host={$env["DB_HOST"]};port={$env["DB_PORT"]};dbname={$env["DB_DATABASE"]};charset=utf8mb4",
                    $env["DB_USERNAME"], $env["DB_PASSWORD"],
                    [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_TIMEOUT => 8]
                  );
                  echo "CREATED_TABLES: ", (int) $pdo->query(
                    "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = " . $pdo->quote("BASE TABLE")
                  )->fetchColumn(), PHP_EOL;
                  echo "RECORDED_MIGRATIONS: ", (int) $pdo->query(
                    "SELECT COUNT(*) FROM migrations"
                  )->fetchColumn(), PHP_EOL;
                } catch (Throwable $e) {
                  fwrite(STDERR, "POST_MIGRATION_VERIFICATION: FAILED.\n");
                  exit(1);
                }
              '
              echo 'Database schema initialization completed. No seeders, SQL imports, existing data removal, or web deployment performed.'
              ;;
            sync)
              if [[ -n "$(git status --porcelain)" ]]; then
                echo 'Refusing to synchronize: local working tree is not clean.'
                exit 1
              fi
              echo '=== FETCH ==='
              git fetch --no-tags origin main
              if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
                echo 'Refusing non-fast-forward update.'
                exit 1
              fi
              git merge --ff-only FETCH_HEAD
              echo '=== SYNCHRONIZED COMMIT ==='
              git rev-parse HEAD
              echo 'No Composer, migrations, or public web deployment performed.'
              ;;
            *)
              echo 'Unsupported operation.'
              exit 1
              ;;
          esac
          REMOTE_SCRIPT

      - name: Security reminder
        if: always()
        shell: bash
        run: |
          echo "Remote operations use cPanel user permissions, not root."
          echo "Only the explicitly selected operation is performed; the guarded migrate-empty operation initializes a verified empty schema."
          echo "No public web deployment, application seeders, or SQL imports are included."
