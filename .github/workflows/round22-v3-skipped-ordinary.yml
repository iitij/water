name: V3 skipped ordinary acceptance cases
on:
  pull_request:
    types: [opened]
    branches: ['integration/accounting-candidate-v2']
    paths: ['.github/workflows/round22-v3-skipped-ordinary.yml']
permissions:
  contents: read
jobs:
  targeted:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'qa/central-v3-skipped-ordinary'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { case: inventory, engine: sqlite, sha: 6dd83043cbef475d12a2c1f9e0e0d5edca35ab2f }
          - { case: legacy-removal-sqlite, engine: sqlite, sha: 6dd83043cbef475d12a2c1f9e0e0d5edca35ab2f }
          - { case: legacy-rollback-sqlite, engine: sqlite, sha: 6dd83043cbef475d12a2c1f9e0e0d5edca35ab2f }
          - { case: legacy-removal-mysql, engine: mysql, sha: 6dd83043cbef475d12a2c1f9e0e0d5edca35ab2f }
          - { case: legacy-rollback-mysql, engine: mysql, sha: 6dd83043cbef475d12a2c1f9e0e0d5edca35ab2f }
    env:
      EXACT_SHA: ${{ matrix.sha }}
      QA_CASE: ${{ matrix.case }}
      DB_CONNECTION: ${{ matrix.engine }}
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, mysqli, dom, curl, fileinfo, gd, intl, zip, bcmath, pcntl, posix
          ini-values: serialize_precision=-1
          coverage: none
          tools: composer:2.9.8
      - name: Verify frozen source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain)"
          test ! -e .env && test ! -e .env.testing
          printf '%s\n' \
            'eddd4997b74fdb1d9ca8177cbb320a2c9c97c7ecbf9d809bdbd9a0584503fc0c  composer.lock' \
            'e080253726c42bc8c4fbfe728b9b09419e42650d9dd3e4987ddd2d2b1608a40a  package-lock.json' \
            '1fe487ad38dcb6d977b4fa11aad22d3aa8edd6c8e467b2652634d6b1a5fb314d  mobile app/pubspec.lock' | sha256sum --check
          git rev-parse HEAD
          php -v
          composer --version
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist --no-scripts
          composer check-platform-reqs
          php artisan package:discover --ansi
          php vendor/bin/phpunit --version
          git diff --exit-code
      - name: Run one approved case group with synthetic database
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/round22-evidence"
          mkdir -p "$evidence"
          name="water-r11-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ "$DB_CONNECTION" = mysql ]; then
            socketdir="$(mktemp -d "$RUNNER_TEMP/r11-socket.XXXXXX")"
            chmod 777 "$socketdir"
            trap 'docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
            export MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
            export MYSQL_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$MYSQL_ROOT_PASSWORD"
            echo "::add-mask::$MYSQL_PASSWORD"
            docker run -d --name "$name" --network none \
              -v "$socketdir:/var/run/mysqld" \
              -e MYSQL_ROOT_PASSWORD -e MYSQL_PASSWORD -e MYSQL_USER=water_qa -e MYSQL_DATABASE=water_test \
              mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b \
              --skip-networking --skip-log-bin --socket=/var/run/mysqld/mysqld.sock
            export DB_SOCKET="$socketdir/mysqld.sock"
            export DB_DATABASE=water_test DB_USERNAME=water_qa DB_PASSWORD="$MYSQL_PASSWORD"
            unset MYSQL_ROOT_PASSWORD MYSQL_PASSWORD
            ready=0
            for i in $(seq 1 90); do
              if docker exec "$name" sh -c 'test "$(cat /proc/1/comm)" = mysqld' 2>/dev/null &&
                 php -r 'try { $p = new PDO("mysql:unix_socket=".getenv("DB_SOCKET").";dbname=water_test", getenv("DB_USERNAME"), getenv("DB_PASSWORD"), [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $v=$p->query("SELECT VERSION(), DATABASE(), @@skip_networking, @@log_bin, @@foreign_key_checks, @@unique_checks")->fetch(PDO::FETCH_NUM); if (!preg_match("/^8\\.0\\.46(?:$|[-+])/", $v[0]) || $v[1] !== "water_test" || (int)$v[2] !== 1 || (int)$v[3] !== 0 || (int)$v[4] !== 1 || (int)$v[5] !== 1 || $p->query("SHOW TABLES")->fetch()) { exit(2); } echo "MySQL ", $v[0], " empty synthetic water_test socket-only FK/unique enabled", PHP_EOL; } catch (Throwable $e) { exit(1); }'; then
                ready=1
                break
              fi
              sleep 1
            done
            test "$ready" -eq 1 || { echo 'QA_BLOCKED: isolated MySQL not ready'; exit 1; }
          else
            test "$DB_DATABASE" = ':memory:'
            php -r 'echo "SQLite ", (new PDO("sqlite::memory:"))->query("SELECT sqlite_version()")->fetchColumn(), PHP_EOL;'
          fi
          case "$QA_CASE" in
            inventory)
              git fetch --no-tags --depth=1 origin 783afe1c01c64ea95b4dabb5e4f488e58820f023 4f058443f75eff18e0d3cb56bcecbfe180f487d1
              git cat-file -e '783afe1c01c64ea95b4dabb5e4f488e58820f023^{commit}'
              git cat-file -e '4f058443f75eff18e0d3cb56bcecbfe180f487d1^{commit}'
              php -l tests/Feature/MobileLaravelChangeInventoryTest.php
              args=(tests/Feature/MobileLaravelChangeInventoryTest.php --filter '^.*::test_inventory_matches_reviewed_git_diff_and_covers_every_changed_path_outside_flutter
          set +e
          timeout 180s php vendor/bin/phpunit "${args[@]}" --fail-on-incomplete --fail-on-skipped --log-junit "$evidence/junit.xml" 2>&1 | tee "$evidence/result.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "ROUND22_CASE=$QA_CASE EXIT=$result"
          if [ -f "$evidence/junit.xml" ]; then
            php -r '$x=simplexml_load_file($argv[1]); foreach($x->testsuite as $s) { foreach(["tests","assertions","errors","failures","skipped"] as $k) echo $k,"=",$s[$k]," "; echo PHP_EOL; } foreach($x->xpath("//testcase[skipped]") as $t) echo "SKIPPED ",$t["class"],"::",$t["name"]," ",trim((string)$t->skipped),PHP_EOL;' "$evidence/junit.xml"
          fi
          git diff --exit-code
          exit "$result"
)
              ;;
            legacy-removal-*)
              export WATER_OBSOLETE_METER_LEGACY_TEST=1
              php -l tests/Feature/ObsoleteMeterLegacyMigrationTest.php
              args=(tests/Feature/ObsoleteMeterLegacyMigrationTest.php --filter '^.*::test_original_twenty_unit_observation_is_removed_by_actual_legacy_migrations
          set +e
          timeout 900s php vendor/bin/phpunit "${args[@]}" --fail-on-incomplete --log-junit "$evidence/junit.xml" 2>&1 | tee "$evidence/result.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "ROUND22_CASE=$QA_CASE EXIT=$result"
          if [ -f "$evidence/junit.xml" ]; then
            php -r '$x=simplexml_load_file($argv[1]); foreach($x->testsuite as $s) { foreach(["tests","assertions","errors","failures","skipped"] as $k) echo $k,"=",$s[$k]," "; echo PHP_EOL; } foreach($x->xpath("//testcase[skipped]") as $t) echo "SKIPPED ",$t["class"],"::",$t["name"]," ",trim((string)$t->skipped),PHP_EOL;' "$evidence/junit.xml"
          fi
          git diff --exit-code
          exit "$result"
)
              ;;
            legacy-rollback-*)
              export WATER_OBSOLETE_METER_LEGACY_TEST=1
              php -l tests/Feature/ObsoleteMeterLegacyMigrationTest.php
              args=(tests/Feature/ObsoleteMeterLegacyMigrationTest.php --filter '^.*::test_legacy_financial_conflict_rolls_back_earlier_pending_cleanup
          set +e
          timeout 900s php vendor/bin/phpunit "${args[@]}" --fail-on-incomplete --log-junit "$evidence/junit.xml" 2>&1 | tee "$evidence/result.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "ROUND22_CASE=$QA_CASE EXIT=$result"
          if [ -f "$evidence/junit.xml" ]; then
            php -r '$x=simplexml_load_file($argv[1]); foreach($x->testsuite as $s) { foreach(["tests","assertions","errors","failures","skipped"] as $k) echo $k,"=",$s[$k]," "; echo PHP_EOL; } foreach($x->xpath("//testcase[skipped]") as $t) echo "SKIPPED ",$t["class"],"::",$t["name"]," ",trim((string)$t->skipped),PHP_EOL;' "$evidence/junit.xml"
          fi
          git diff --exit-code
          exit "$result"
)
              ;;
            *) exit 2 ;;
          esac
          set +e
          timeout 900s php vendor/bin/phpunit "${args[@]}" --fail-on-incomplete --log-junit "$evidence/junit.xml" 2>&1 | tee "$evidence/result.log"
          result=${PIPESTATUS[0]}
          set -e
          echo "ROUND22_CASE=$QA_CASE EXIT=$result"
          if [ -f "$evidence/junit.xml" ]; then
            php -r '$x=simplexml_load_file($argv[1]); foreach($x->testsuite as $s) { foreach(["tests","assertions","errors","failures","skipped"] as $k) echo $k,"=",$s[$k]," "; echo PHP_EOL; } foreach($x->xpath("//testcase[skipped]") as $t) echo "SKIPPED ",$t["class"],"::",$t["name"]," ",trim((string)$t->skipped),PHP_EOL;' "$evidence/junit.xml"
          fi
          git diff --exit-code
          exit "$result"
