name: Audit legacy tenant and multi-meter UI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "resources/views/**"
      - "mobile app/lib/**"
      - ".github/workflows/audit-legacy-meter-ui.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory legacy tenant references
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Backend + blade tenant references"
          grep -RInE 'tenant_name|tenant_phone|tenantName|tenantPhone|مستأجر|inv_show_tenant|rect_show_tenant' app resources/views || true
          echo "::endgroup::"
          echo "::group::Flutter tenant references"
          grep -RInE 'tenant_name|tenant_phone|tenantName|tenantPhone|مستأجر' 'mobile app/lib' || true
          echo "::endgroup::"
          echo "::group::Operational multi-meter assumptions"
          grep -RInE 'meters\(\)->first|meters->first|meters\.first|meters\.length\s*[!=<>]=?\s*1|metersCount|meters_count|إضافة عداد آخر|حفظ وإضافة عداد آخر' app resources/views 'mobile app/lib' | head -160 || true
          echo "::endgroup::"
