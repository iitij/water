name: Water Flutter single-meter check

on:
  push:
    branches: [main]
    paths:
      - "mobile app/lib/core/l10n/subscriber_experience_strings.dart"
      - "mobile app/lib/core/diagnostics/api_log_manager.dart"
      - "mobile app/test/core/l10n/laravel_screen_strings_test.dart"
      - "mobile app/test/core/diagnostics/api_log_manager_test.dart"
      - "mobile app/test/ui/water_experience_test.dart"
      - "mobile app/lib/features/meters/data/models/meter.dart"
      - "mobile app/lib/features/meters/data/repositories/meters_repository_impl.dart"
      - "mobile app/lib/features/meters/data/datasources/meters_remote_data_source.dart"
      - "mobile app/lib/features/meters/domain/meters_repository.dart"
      - "mobile app/lib/features/meters/presentation/pages/meter_replacement_dialog.dart"
      - "mobile app/lib/features/offline_sync/domain/sync_batch_response_policy.dart"
      - "mobile app/lib/features/offline_sync/services/sync_queue_manager.dart"
      - "mobile app/test/features/offline_sync/sync_batch_response_policy_test.dart"
      - "mobile app/test/features/meters/meter_replacement_dialog_test.dart"

      - "mobile app/lib/features/subscribers/data/models/subscriber_model.dart"
      - "mobile app/test/features/meters/data/models/meter_test.dart"
      - "mobile app/test/features/subscribers/subscriber_list_options_test.dart"
      - "mobile app/lib/features/meters/presentation/pages/meter_form_screen.dart"
      - "mobile app/lib/features/subscribers/presentation/widgets/subscriber_360_tabs.dart"
      - ".github/workflows/flutter-single-meter-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-changed-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "mobile app"
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze changed Flutter modules
        run: |
          dart analyze lib/core/l10n/subscriber_experience_strings.dart lib/core/diagnostics/api_log_manager.dart lib/features/offline_sync/domain/sync_batch_response_policy.dart lib/features/offline_sync/services/sync_queue_manager.dart lib/features/meters/data/models/meter.dart lib/features/meters/data/datasources/meters_remote_data_source.dart lib/features/meters/domain/meters_repository.dart lib/features/meters/presentation/pages/meter_replacement_dialog.dart lib/features/meters/data/repositories/meters_repository_impl.dart lib/features/meters/presentation/pages/meter_form_screen.dart lib/features/subscribers/data/models/subscriber_model.dart lib/features/subscribers/presentation/pages/subscriber_360_screen.dart
      - name: Single-meter Flutter tests
        run: flutter test test/features/meters/meter_replacement_dialog_test.dart test/features/meters/data/models/meter_test.dart test/features/subscribers/subscriber_list_options_test.dart test/features/offline_sync/sync_batch_response_policy_test.dart test/features/offline_sync/sync_failure_planner_test.dart
      - name: Set up PHP for Laravel translation fixtures
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Install Laravel vendor translations for cross-platform tests
        working-directory: .
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          composer install --no-interaction --no-progress --prefer-dist
      - name: Full Flutter unit and widget regression suite
        run: flutter test --concurrency=2
