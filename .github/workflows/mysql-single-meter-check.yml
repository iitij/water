name: Water single-meter MySQL compatibility

on:
  push:
    branches: [main]
    paths:
      - "database/migrations/**"
      - "tests/scripts/mysql_single_meter_smoke.php"
      - ".github/workflows/mysql-single-meter-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario: [fresh, legacy-clean, legacy-financial]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: water_test
          MYSQL_USER: water
          MYSQL_PASSWORD: ci_water_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: mysql
      DB_URL: ""
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      WATER_SINGLE_METER_TEST_DB: water_test
      DB_USERNAME: water
      DB_PASSWORD: ci_water_only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.4 with MySQL PDO
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, mysqli, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Prepare Laravel storage and dependencies
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
      - name: Build current schema in fresh scenario
        if: matrix.scenario == 'fresh'
        run: php artisan migrate --force --no-interaction
      - name: Run scenario and require explicit success
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          php -l tests/scripts/mysql_single_meter_smoke.php
          php tests/scripts/mysql_single_meter_smoke.php "$SCENARIO" 2>&1 | tee single-meter-smoke.log
          case "$SCENARIO" in
            fresh) grep -Fx 'PASS: fresh single-meter uniqueness and foreign key' single-meter-smoke.log ;;
            legacy-clean) grep -Fx 'PASS: historical operational cleanup and final constraints' single-meter-smoke.log ;;
            legacy-financial) grep -Fx 'PASS: historical financial protection and rollback' single-meter-smoke.log ;;
            *) exit 1 ;;
          esac
      - name: Audit fresh single-meter schema
        if: matrix.scenario == 'fresh'
        run: php artisan water:audit-single-meter
      - name: Exercise retired billing schema upgrade and financial guard
        if: matrix.scenario == 'fresh'
        run: |
          php -l tests/scripts/mysql_retired_billing_upgrade_smoke.php
          php tests/scripts/mysql_retired_billing_upgrade_smoke.php
