name: Water | Laravel and frontend build readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: water-build-readiness
  cancel-in-progress: false

jobs:
  laravel-dependencies:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'iitij') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/permanent-close-pending-funding') }}
    name: Validate locked Laravel dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, openssl, zip
          tools: composer:v2
          coverage: none
      - name: Check Composer files
        run: |
          set -euo pipefail
          test -s composer.json
          test -s composer.lock
          composer validate --no-check-publish
      - name: Install production dependencies without Composer scripts
        env:
          COMPOSER_NO_INTERACTION: '1'
        run: |
          set -euo pipefail
          composer install --no-dev --no-scripts --no-progress --prefer-dist --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Dependency validation summary
        run: echo 'Composer dependencies validated in isolated GitHub runner. No deployment or migrations.'

  frontend-build:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'iitij') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/permanent-close-pending-funding') }}
    name: Build Laravel Vite assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore locked NPM dependencies without lifecycle scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -euo pipefail
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build frontend assets
        run: npm run build
      - name: Verify Vite manifest
        run: |
          set -euo pipefail
          test -s public/build/manifest.json
          echo 'Built public/build assets without requiring Node.js on Namecheap.'
      - name: Report build readiness
        run: |
          echo '### Water build readiness' >> "$GITHUB_STEP_SUMMARY"
          echo 'Vite build and manifest verification passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow intentionally does not upload, persist, or deploy generated frontend files.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment of assets will be handled by a separate approved release workflow.' >> "$GITHUB_STEP_SUMMARY"
