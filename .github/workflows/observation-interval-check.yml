name: Observation-based reading period acceptance
on:
  push:
    branches: ['main', 'fix/observation-period-v2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laravel:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: find app tests database routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: New observation interval contract
        run: php artisan test tests/Feature/ObservationReadingIntervalTest.php
      - name: Existing period and reading regression
        run: php artisan test tests/Feature/ReadingPeriodInvoiceConsistencyTest.php tests/Feature/SingleCurrentMeterTest.php
      - name: Full Laravel regression
        run: php artisan test
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'mobile app'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Install Laravel dependencies for translation parity tests
        working-directory: .
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs
          composer install --no-interaction --no-progress --prefer-dist
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: water_test
          MYSQL_USER: water
          MYSQL_PASSWORD: ci_water_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water
      DB_PASSWORD: ci_water_only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, mysqli, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php artisan migrate:fresh --force --no-interaction
      - run: php artisan test --filter='ObservationReadingIntervalTest|ReadingPeriodInvoiceConsistencyTest|HistoricalTariffTest|SingleCurrentMeterTest|FinancialReversalTest|LedgerDatabaseProtectionTest|CashHandoverTest|TreasuryRegisterTest|CollectorFundingTest|TreasuryTransferTest|BankReconciliationTest|TreasuryCashCountTest|TreasuryBankFeeTest|TreasuryCashAdjustmentTest'
      - name: Real parallel observation and accounting writes
        run: php artisan test tests/Feature/FinancialConcurrencyTest.php
      - name: Verify MySQL ledger trigger installation and raw SQL protection
        env:
          CI_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec "$CI_MYSQL_CONTAINER" mysql -uroot -pci_root_only -e 'SET GLOBAL log_bin_trust_function_creators = 1'
          php artisan test tests/Feature/LedgerMysqlProtectionTest.php
