name: Retired feature removal gate
on:
  push:
    paths:
      - '.github/workflows/legacy-feature-audit.yml'
      - 'app/**'
      - 'mobile app/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/**'
      - 'tests/**'
      - 'config/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-removed-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired billing and identity feature dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Upgrade-only scrubbers and acceptance tests mention old field names.
          matches="$(git grep -In -i -E 'tanker|water_tanker|service.?requests?|ServiceRequest|وايت|tenant_name|tenant_phone|المستأجر' -- app routes database resources config 'mobile app/lib' 'mobile app/test' tests || true)"
          matches="$(printf '%s\n' "$matches" | grep -vE '^database/migrations/2026_11_16_000001_final_retired_billing_cleanup.php:|^tests/Feature/RetiredBillingFeatureSchemaTest.php:|^mobile app/lib/core/database/retired_cache_cleanup.dart:' || true)"
          if [[ -n "$matches" ]]; then
            printf 'Removed feature references are still active:\n%s\n' "$matches"
            exit 1
          fi
          echo "No removed-feature references remain in active project source."
