name: Final accounting integration candidate
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  sqlite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Verify close control privilege isolation
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_close_control_isolation_rejects_broad_and_direct_writes|test_only_exact_schema_lock_tables_is_allowed_without_close_control_dml' tests/Unit/RuntimeDatabasePrivilegesTest.php
  mysql:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: water_test
          MYSQL_USER: water_qa
          MYSQL_PASSWORD: disposable_qa_password
          MYSQL_ROOT_PASSWORD: disposable_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water_qa
      DB_PASSWORD: disposable_qa_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pcntl, posix, mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Permit migration triggers in disposable MySQL only
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e 'SET GLOBAL log_bin_trust_function_creators=1; SELECT @@global.log_bin_trust_function_creators;'

      - name: Prepare isolated runtime privileges
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          php artisan migrate --force
          php artisan ledger:protect --install
          php artisan financial:database-preflight --guards
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e "CREATE USER 'water_close_runtime'@'%' IDENTIFIED BY 'disposable_close_password'; GRANT EXECUTE ON PROCEDURE water_test.financial_read_trigger_metadata TO 'water_close_runtime'@'%'; GRANT LOCK TABLES ON \`water\\_test\`.* TO 'water_close_runtime'@'%';"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -N -B -e "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA='water_test' AND TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME" | while IFS= read -r table; do
            [[ "$table" =~ ^[a-zA-Z0-9_]+$ ]]
            case "$table" in
              financial_scopes|financial_periods|financial_close_commands|financial_period_closures) privileges=SELECT ;;
              *) privileges='SELECT, INSERT, UPDATE, DELETE' ;;
            esac
            docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e "GRANT $privileges ON water_test.$table TO 'water_close_runtime'@'%';"
          done
      - name: Verify isolated runtime and privileged freeze serialization
        env:
          WATER_QA_CLOSE_CONTROL: '1'
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter test_close_control_isolated_runtime_serializes_against_privileged_freeze tests/Feature/FinancialCloseRuntimePrivilegesTest.php
