name: Final accounting integration candidate
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  sqlite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Verify combined outstanding period evidence and affected close diagnostics
        run: |
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_final_accounting_cash_session_decision_requires_independent_actor|test_custody_source_coverage_keeps_shortage_visible_after_full_handover' tests/Feature/GatedCashCountAdjustmentWriterTest.php
  mysql:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: water_test
          MYSQL_USER: water_qa
          MYSQL_PASSWORD: disposable_qa_password
          MYSQL_ROOT_PASSWORD: disposable_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water_qa
      DB_PASSWORD: disposable_qa_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pcntl, posix, mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Permit migration triggers in disposable MySQL only
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e 'SET GLOBAL log_bin_trust_function_creators=1; SELECT @@global.log_bin_trust_function_creators;'

      - name: Verify independent cash session decision and shortage carry
        run: |
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_final_accounting_cash_session_decision_requires_independent_actor|test_custody_source_coverage_keeps_shortage_visible_after_full_handover' tests/Feature/GatedCashCountAdjustmentWriterTest.php
      - name: Provision disposable restricted runtime fixture
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test "$APP_ENV" = testing
          test "$DB_DATABASE" = water_test
          test -n "$QA_CONTAINER"
          php artisan migrate:fresh --force
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); app(App\Services\LedgerProtection::class)->install(); app(App\Services\AllocationHistoryProtection::class)->install(); app(App\Services\FinancialTriggerMetadata::class)->install();'
          docker exec -i "$QA_CONTAINER" mysql -uroot -pdisposable_root_password <<'SQL'
          CREATE USER 'water_runtime'@'%' IDENTIFIED BY 'disposable_runtime_password';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `water\_test`.* TO 'water_runtime'@'%';
          GRANT EXECUTE ON PROCEDURE `water_test`.`financial_read_trigger_metadata` TO 'water_runtime'@'%';
          SQL
      - name: Verify runtime DML isolation and live financial protections
        env:
          WATER_QA_RUNTIME: '1'
        run: |
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite tests/Feature/FinancialCloseRuntimePrivilegesTest.php
