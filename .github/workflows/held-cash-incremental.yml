name: Prospective database privilege preflight
on:
  push:
    branches: ['release/prospective-database-preflight']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Verify grant allowlist
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite tests/Unit/RuntimeDatabasePrivilegesTest.php
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: water_test
          MYSQL_USER: water_qa
          MYSQL_PASSWORD: disposable_qa_password
          MYSQL_ROOT_PASSWORD: disposable_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water_qa
      DB_PASSWORD: disposable_qa_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, posix, mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Permit migration triggers in disposable MySQL only
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e 'SET GLOBAL log_bin_trust_function_creators=1; SELECT @@global.log_bin_trust_function_creators;'
      - name: Verify grant allowlist
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite tests/Unit/RuntimeDatabasePrivilegesTest.php
      - name: Verify deployment account and actual restricted runtime account
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force
          php artisan ledger:protect --install
          php artisan financial:database-preflight --guards
          if php artisan financial:database-preflight --runtime; then
            echo 'Elevated migration account unexpectedly accepted'
            exit 1
          fi
          docker exec -i "$QA_CONTAINER" mysql -uroot -pdisposable_root_password <<'SQL'
          CREATE TABLE water_test.runtime_privilege_probe (id INT PRIMARY KEY, value INT);
          CREATE USER 'water_runtime_qa'@'%' IDENTIFIED BY 'disposable_runtime_password';
          GRANT SELECT, INSERT, UPDATE, DELETE ON water_test.runtime_privilege_probe TO 'water_runtime_qa'@'%';
          SQL
          DB_USERNAME=water_runtime_qa DB_PASSWORD=disposable_runtime_password php artisan financial:database-preflight --runtime
          docker exec "$QA_CONTAINER" mysql -uwater_runtime_qa -pdisposable_runtime_password water_test -e 'INSERT INTO runtime_privilege_probe VALUES (1,2); UPDATE runtime_privilege_probe SET value=3 WHERE id=1; SELECT * FROM runtime_privilege_probe; DELETE FROM runtime_privilege_probe WHERE id=1;'
          if docker exec "$QA_CONTAINER" mysql -uwater_runtime_qa -pdisposable_runtime_password water_test -e 'DROP TABLE runtime_privilege_probe'; then
            echo 'Restricted account unexpectedly allowed DDL'
            exit 1
          fi
          if docker exec "$QA_CONTAINER" mysql -uwater_runtime_qa -pdisposable_runtime_password water_test -e 'CREATE TRIGGER runtime_probe BEFORE INSERT ON runtime_privilege_probe FOR EACH ROW SET NEW.value=0'; then
            echo 'Restricted account unexpectedly allowed trigger creation'
            exit 1
          fi
