name: Final accounting integration candidate
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  sqlite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Verify runtime privilege parser
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite tests/Unit/RuntimeDatabasePrivilegesTest.php
  mysql:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: water_test
          MYSQL_USER: water_qa
          MYSQL_PASSWORD: disposable_qa_password
          MYSQL_ROOT_PASSWORD: disposable_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water_qa
      DB_PASSWORD: disposable_qa_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pcntl, posix, mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Permit migration triggers in disposable MySQL only
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e 'SET GLOBAL log_bin_trust_function_creators=1; SELECT @@global.log_bin_trust_function_creators;'

      - name: Verify runtime privilege parser
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite tests/Unit/RuntimeDatabasePrivilegesTest.php
      - name: Prepare disposable financial control schema
        run: |
          set -euo pipefail
          php artisan migrate:fresh --force
      - name: Provision restricted QA runtime identity
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec -i "$QA_CONTAINER" mysql -uroot -pdisposable_root_password water_test <<'SQL'
          INSERT INTO financial_scopes (scope_key, currency, timezone, mode, calendar_version, fence_epoch)
            VALUES ('water', 'YER', 'Asia/Aden', 'ACTIVE', 1, 5);
          INSERT INTO financial_periods (scope_key, month, start_on, next_on, state, version)
            VALUES ('water', '2026-11', '2026-11-01', '2026-12-01', 'OPEN', 2);
          CREATE USER 'water_runtime_qa'@'%' IDENTIFIED BY 'disposable_runtime_password';
          GRANT LOCK TABLES ON `water\_test`.* TO 'water_runtime_qa'@'%';
          GRANT SELECT ON `water_test`.`financial_scopes` TO 'water_runtime_qa'@'%';
          GRANT SELECT ON `water_test`.`financial_periods` TO 'water_runtime_qa'@'%';
          GRANT SELECT ON `water_test`.`financial_close_commands` TO 'water_runtime_qa'@'%';
          GRANT SELECT ON `water_test`.`financial_period_closures` TO 'water_runtime_qa'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `water_test`.`payments` TO 'water_runtime_qa'@'%';
          SQL
      - name: Prepare synthetic posting actor and read-only metadata routine
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter test_prepare_disposable_runtime_posting_fixture tests/Feature/RuntimeCloseControlIsolationTest.php
      - name: Grant exact operational permissions for treasury posting
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          while IFS= read -r table; do
            [[ "$table" =~ ^[a-zA-Z0-9_]+$ ]]
            docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e "GRANT SELECT ON \`water_test\`.\`$table\` TO 'water_runtime_qa'@'%';"
          done < <(docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -N -e "SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA='water_test' AND TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME")
          docker exec -i "$QA_CONTAINER" mysql -uroot -pdisposable_root_password water_test <<'SQL'
          GRANT INSERT ON `water_test`.`treasury_accounts` TO 'water_runtime_qa'@'%';
          GRANT INSERT ON `water_test`.`audit_events` TO 'water_runtime_qa'@'%';
          GRANT INSERT ON `water_test`.`financial_posting_operations` TO 'water_runtime_qa'@'%';
          GRANT INSERT ON `water_test`.`financial_posting_events` TO 'water_runtime_qa'@'%';
          GRANT EXECUTE ON PROCEDURE `water_test`.`financial_read_trigger_metadata` TO 'water_runtime_qa'@'%';
          SQL
      - name: Verify actual runtime locks and denied financial control writes
        env:
          DB_USERNAME: water_runtime_qa
          DB_PASSWORD: disposable_runtime_password
          FINANCIAL_TRIGGER_METADATA_ROUTINE: 'true'
        run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_restricted_runtime_can_' tests/Feature/RuntimeCloseControlIsolationTest.php
