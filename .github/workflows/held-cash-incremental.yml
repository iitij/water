name: Prospective mobile decision locked SDK verification
on:
  push:
    branches: ['release/prospective-void-mobile-decision-sdk']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: "mobile app"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Verify source and resolve dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          flutter --version
          sha256sum pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze changed modules
        run: dart analyze --no-fatal-warnings lib/features/payments/data/models/payment_model.dart lib/features/payments/data/datasources/payments_remote_datasource.dart lib/features/payments/data/repositories/payments_repository_impl.dart lib/features/payments/domain/repositories/payments_repository.dart lib/features/payments/presentation/sheets/void_requests_sheet.dart test/features/payments/bound_void_decision_test.dart
      - name: Verify bound decisions and affected list widget
        run: flutter test --no-pub test/features/payments/bound_void_decision_test.dart test/features/payments/void_requests_pagination_test.dart
