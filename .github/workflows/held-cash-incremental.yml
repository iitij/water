name: Final accounting integration candidate
on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  sqlite:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Verify held credit guard and affected financial writer integration
        run: |
          set -euo pipefail
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_held_credit_requires_live_subscriber_ledger_protection|test_release_held_credit_model_fence_rejects_direct_document_and_ledger|test_release_invoice_api_shares_issue_identity_and_cancellation_reversal|test_release_refund_entrypoints_modal_and_api_share_atomic_debit|test_release_settlement_api_(claim|late_bank|late_cash|counted_cash)|test_final_accounting_integrated_cycle_with_shortage_recovery_and_residual_loss' tests/Feature/GatedCashCountAdjustmentWriterTest.php
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_direct_cash_receipt_and_exact_replay_register_only_subscriber_effect|test_registry_insert_failure_rolls_back_receipt_and_ledger_then_exact_retry' tests/Feature/GatedCashReceiptWriterTest.php
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter test_exact_capacity_across_subscribers_and_replay_after_later_allocation tests/Feature/GatedCountedCashWriterTest.php
  mysql:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/resume-175-final-accounting-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: water_test
          MYSQL_USER: water_qa
          MYSQL_PASSWORD: disposable_qa_password
          MYSQL_ROOT_PASSWORD: disposable_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water_qa
      DB_PASSWORD: disposable_qa_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, pcntl, posix, mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Permit migration triggers in disposable MySQL only
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e 'SET GLOBAL log_bin_trust_function_creators=1; SELECT @@global.log_bin_trust_function_creators;'

      - name: Verify held credit guard and affected financial writer integration
        run: |
          set -euo pipefail
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_held_credit_requires_live_subscriber_ledger_protection|test_release_held_credit_model_fence_rejects_direct_document_and_ledger|test_release_invoice_api_shares_issue_identity_and_cancellation_reversal|test_release_refund_entrypoints_modal_and_api_share_atomic_debit|test_release_settlement_api_(claim|late_bank|late_cash|counted_cash)|test_final_accounting_integrated_cycle_with_shortage_recovery_and_residual_loss' tests/Feature/GatedCashCountAdjustmentWriterTest.php
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_direct_cash_receipt_and_exact_replay_register_only_subscriber_effect|test_registry_insert_failure_rolls_back_receipt_and_ledger_then_exact_retry' tests/Feature/GatedCashReceiptWriterTest.php
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter test_exact_capacity_across_subscribers_and_replay_after_later_allocation tests/Feature/GatedCountedCashWriterTest.php
