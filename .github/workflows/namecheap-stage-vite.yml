name: Water | Stage frontend assets on Namecheap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-stage-frontend
  cancel-in-progress: false

jobs:
  stage-frontend:
    name: Build and stage Vite assets (not publish)
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'iitij' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Produce frontend assets from lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          test -s public/build/manifest.json
          tar -czf "$RUNNER_TEMP/water-assets.tar.gz" -C public build
          echo "Vite assets generated for commit $GITHUB_SHA"

      - name: Prepare SSH and verify the Namecheap host
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY" || { echo "::error::Missing SSH secret"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/namecheap-ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/namecheap-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/namecheap-ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/namecheap-ssh/id_ed25519" >/dev/null
          ssh-keyscan -T 15 -p 21098 -t ed25519 66.29.146.205 \
            > "$RUNNER_TEMP/namecheap-ssh/known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/namecheap-ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fingerprint" = 'SHA256:30IXGrYxD3pXnfOdvFZMCJ5YShzaMeRCYXRWXYnl4Rw' ||
            { echo "::error::Unexpected host fingerprint"; exit 1; }

      - name: Transfer to private staging directory (no public release)
        shell: bash
        run: |
          set -euo pipefail
          stage=".water-build-stage/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -T -p 21098 \
            -i "$RUNNER_TEMP/namecheap-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/namecheap-ssh/known_hosts" \
            -o ConnectTimeout=20 \
            alweufti@66.29.146.205 \
            "set -eu; cd \"\$HOME\"; umask 077; mkdir -p '$stage'; tar -xzf - -C '$stage'; test -s '$stage/build/manifest.json'; echo 'STAGED_ASSETS: $stage/build'" \
            < "$RUNNER_TEMP/water-assets.tar.gz"
          echo "### Frontend build staged (not published)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remote private directory: \`~/$stage/build\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- The Laravel project and public_html were not modified." >> "$GITHUB_STEP_SUMMARY"
