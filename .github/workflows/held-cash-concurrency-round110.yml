name: Held cash lock-order concurrency acceptance
on:
  push:
    branches: ['qa/held-cash-concurrency-round110']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: water_test
          MYSQL_USER: water_qa
          MYSQL_PASSWORD: disposable_qa_password
          MYSQL_ROOT_PASSWORD: disposable_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water_qa
      DB_PASSWORD: disposable_qa_password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pcntl, posix, mbstring, pdo_mysql, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Verify source and install locked dependencies
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sha256sum composer.lock
          test ! -e .env
          test ! -e .env.testing
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
          git diff --exit-code -- composer.lock
      - name: Permit migration triggers in disposable MySQL only
        env:
          QA_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          set -euo pipefail
          test -n "$QA_CONTAINER"
          docker exec "$QA_CONTAINER" mysql -uroot -pdisposable_root_password -e 'SET GLOBAL log_bin_trust_function_creators=1; SELECT @@global.log_bin_trust_function_creators;'
      - name: Verify PHP syntax for changed product and concurrency files
        run: |
          set -euo pipefail
          for f in app/Services/PaymentService.php app/Services/PaymentRefundService.php app/Services/LateReceiptReviewService.php app/Services/NonCashClaimService.php app/Services/BankReconciliationService.php tests/Feature/GatedCashCountAdjustmentWriterTest.php tests/Feature/FinancialConcurrencyTest.php; do
            php -l "$f"
          done
      - name: Independent MySQL processes for changed lock ordering
        run: |
          vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite --filter 'test_round110_|test_same_sync_uuid_concurrent_replay_creates_one_receipt_and_one_ledger_entry|test_parallel_payments_for_different_subscribers_cannot_share_uuid|test_parallel_distinct_payments_get_unique_receipt_numbers_and_ledger_entries|test_invoice_and_collection_in_parallel_conserve_the_balance|test_parallel_cash_collection_and_close_preserve_finalized_cash_snapshot|test_concurrent_late_receipt_approvals_cannot_allocate_same_counted_surplus|test_p1_corrections_concurrent_refund_and_void_cannot_both_commit' tests/Feature/FinancialConcurrencyTest.php
