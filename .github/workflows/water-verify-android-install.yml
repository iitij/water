name: Verify a Water Android artifact
on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Water-Android-preview
          path: delivery
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
      - name: Verify fresh APK installation and launch on Android 35
        shell: bash
        run: |
          set -euo pipefail
          (cd delivery && sha256sum --check SHA256SUMS.txt)
          sdk="$ANDROID_HOME"
          export PATH="$sdk/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/water-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          manager="$sdk/cmdline-tools/latest/bin"
          "$manager/sdkmanager" --install "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools"
          if [[ ! -w /dev/kvm ]]; then sudo setfacl -m "u:$(whoami):rw" /dev/kvm; fi
          avd="$ANDROID_AVD_HOME/water-preview.avd"
          "$manager/avdmanager" create avd --force -n water-preview --device pixel_5 --path "$avd" -k "system-images;android-35;google_apis;x86_64" </dev/null
          test -s "$avd/config.ini"
          if [[ ! -s "$ANDROID_AVD_HOME/water-preview.ini" ]]; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$avd" > "$ANDROID_AVD_HOME/water-preview.ini"
          fi
          "$sdk/emulator/emulator" -list-avds | grep -Fx water-preview
          "$sdk/emulator/emulator" @water-preview -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 240 adb wait-for-device; then tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; fi
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
          adb install delivery/Water-Android-preview.apk
          app=com.waterproject.app.water_project
          activity="$(adb shell cmd package resolve-activity --brief "$app" | tr -d '\r' | tail -1)"
          [[ "$activity" == "$app/"* ]]
          adb shell am start -W -n "$activity" | tee "$RUNNER_TEMP/app-launch.txt"
          grep -q 'Status: ok' "$RUNNER_TEMP/app-launch.txt"
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          verified=0
          for attempt in $(seq 1 12); do
            echo "UI readiness attempt $attempt"
            adb shell rm -f /sdcard/water-window.xml
            if timeout 15 adb shell uiautomator dump /sdcard/water-window.xml &&
               adb pull /sdcard/water-window.xml "$RUNNER_TEMP/water-window.xml" &&
               python3 -c 'import sys, xml.etree.ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); sys.exit(0 if any(n.get("package")==sys.argv[2] for n in root.iter("node")) else 1)' "$RUNNER_TEMP/water-window.xml" "$app" &&
               adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -F "$app/" &&
               adb shell pidof "$app"; then
              verified=1
              break
            fi
            sleep 5
          done
          if [[ "$verified" != 1 ]]; then
            echo "::error::Water did not expose an active app UI before the readiness deadline"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb logcat -d -t 1500 -s AndroidRuntime:E | tail -80 || true
            exit 1
          fi
