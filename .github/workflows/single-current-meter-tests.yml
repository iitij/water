name: Water single-meter acceptance

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "resources/views/**"
      - "tests/**"
      - "database/migrations/**"
      - ".github/workflows/single-current-meter-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          chmod -R u+rwX bootstrap/cache storage/framework storage/logs
      - name: Install pinned Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP syntax checks
        run: |
          php -l app/Services/SingleMeterService.php
          php -l tests/Feature/SingleMeterFilamentIntegrationTest.php
          php -l app/Services/CurrentMeterBillingGuard.php
          php -l app/Services/CurrentMeterReadingGuard.php
          php -l app/Services/InvoiceService.php
          php -l app/Filament/Resources/InvoiceResource.php
          php -l app/Filament/Resources/InvoiceResource/Pages/CreateInvoice.php
          php -l app/Http/Controllers/Api/MeterController.php
          php -l app/Filament/Resources/Meters/Schemas/MeterForm.php
          php -l app/Filament/Resources/Meters/Pages/EditMeter.php
          php -l app/Filament/Resources/Meters/Tables/MetersTable.php
          php -l app/Filament/Resources/SubscriberResource.php
          php -l app/Http/Controllers/Api/InvoiceController.php
          php -l app/Http/Controllers/Api/PaymentController.php
          php -l app/Http/Controllers/Api/SubscriberController.php
          php -l app/Services/WhatsAppService.php
          php -l app/Services/DataExportService.php
          php -l app/Filament/Pages/InvoiceSettings.php
          php -l app/Filament/Pages/ReceiptSettings.php
          php -l app/Filament/Resources/ReadingResource.php
          php -l app/Filament/Resources/ReadingResource/Pages/CreateReading.php
          php -l app/Filament/Resources/SubscriberResource/RelationManagers/MetersRelationManager.php
          php -l app/Console/Commands/AuditSingleMeterConflicts.php
          php -l database/migrations/2026_11_12_230000_enforce_one_current_meter_per_subscriber.php
          php -l database/migrations/2026_11_16_000001_final_retired_billing_cleanup.php
          # Review every active PHP source, not just a manually maintained shortlist.
          find app database/migrations tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Single meter and subscriber metadata tests
        run: php artisan test --filter='SingleCurrentMeterTest|SubscriberListMetadataTest|FouadModulesApiTest|MobileApiIntegrationTest|FinancialReportsTest|WebMobileParityTest|PaymentVoidApprovalTest'
      - name: Full Laravel regression suite
        run: php artisan test
