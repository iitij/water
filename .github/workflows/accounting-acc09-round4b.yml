name: ACC-09 Round 4B focused checkpoint
on:
  push:
    branches:
      - 'integration/team-b-acc09-round4b'
permissions:
  contents: read
concurrency:
  group: acc09-round4b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, gd, intl, zip, bcmath
          coverage: none
      - run: git rev-parse HEAD && php -v && php tests/Unit/acc09_financial_boundary_check.php
      - run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Scoped product regressions
        run: vendor/bin/phpunit --filter='Acc09CanonicalIntegrationTest|ExactMoneyTest|HistoricalTariffTest|QuickReceiptWidgetTest|FinancialReversalTest|UnifiedSubscriberAccountTest|LiveCollectionAmountTest'
  mysql:
    needs: sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: water_test
          MYSQL_USER: water
          MYSQL_PASSWORD: ci_water_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=
      DB_CONNECTION: mysql
      DB_URL: ''
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: water_test
      DB_USERNAME: water
      DB_PASSWORD: ci_water_only
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, mysqli, dom, curl, fileinfo, gd, intl, zip, bcmath, pcntl, posix
          coverage: none
      - run: git rev-parse HEAD && php -v
      - run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Scoped product regressions
        run: vendor/bin/phpunit --filter='Acc09CanonicalIntegrationTest|ExactMoneyTest|HistoricalTariffTest|QuickReceiptWidgetTest|FinancialReversalTest|UnifiedSubscriberAccountTest|LiveCollectionAmountTest'
