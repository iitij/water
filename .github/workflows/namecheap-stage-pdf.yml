name: Water | Stage PDF dependencies on Namecheap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: water-namecheap-remote
  cancel-in-progress: false

jobs:
  stage-pdf:
    name: Prepare locked Puppeteer dependencies (no browser launch)
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'iitij' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install production Node dependencies on the runner
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform + "-" + process.arch')" = linux-x64
          node -e 'const p=require("./package-lock.json").packages["node_modules/puppeteer"]; if(p.version!=="25.16.0")process.exit(1)'
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import puppeteer from "puppeteer"; if(typeof puppeteer.launch!=="function")process.exit(1); console.log("PUPPETEER_MODULE: VERIFIED")'
          tar -czf "$RUNNER_TEMP/water-pdf-deps.tar.gz" package.json package-lock.json node_modules
          echo "STAGED_ARCHIVE_BYTES: $(stat -c %s "$RUNNER_TEMP/water-pdf-deps.tar.gz")"

      - name: Prepare SSH and verify the Namecheap host
        shell: bash
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PRIVATE_KEY" || { echo "::error::Missing SSH secret"; exit 1; }
          umask 077
          mkdir -p "$RUNNER_TEMP/namecheap-ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$RUNNER_TEMP/namecheap-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/namecheap-ssh/id_ed25519"
          ssh-keygen -y -f "$RUNNER_TEMP/namecheap-ssh/id_ed25519" >/dev/null
          ssh-keyscan -T 15 -p 21098 -t ed25519 66.29.146.205 \
            > "$RUNNER_TEMP/namecheap-ssh/known_hosts" 2>/dev/null
          fingerprint="$(ssh-keygen -lf "$RUNNER_TEMP/namecheap-ssh/known_hosts" -E sha256 | awk 'NR==1 {print $2}')"
          test "$fingerprint" = 'SHA256:30IXGrYxD3pXnfOdvFZMCJ5YShzaMeRCYXRWXYnl4Rw' ||
            { echo "::error::Unexpected host fingerprint"; exit 1; }

      - name: Transfer locked dependencies into private staging directory
        shell: bash
        run: |
          set -euo pipefail
          stage=".water-pdf-stage/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -T -p 21098 \
            -i "$RUNNER_TEMP/namecheap-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/namecheap-ssh/known_hosts" \
            -o ConnectTimeout=20 \
            alweufti@66.29.146.205 \
            "set -eu; cd \"\$HOME\"; umask 077; test \"\$(id -un)\" = alweufti; test \"\$(uname -m)\" = x86_64; mkdir -p '$(dirname "$stage")'; mkdir '$stage'; tar -xzf - -C '$stage'; cmp '$stage/package-lock.json' repositories/water/package-lock.json; cmp '$stage/package.json' repositories/water/package.json; cd '$stage'; export PATH=/opt/alt/alt-nodejs24/root/usr/bin:\$PATH; node --version; node --input-type=module -e 'import puppeteer from \"puppeteer\"; if(typeof puppeteer.launch!==\"function\")process.exit(1); console.log(\"REMOTE_PUPPETEER_MODULE: VERIFIED\")'; echo 'PRIVATE_PDF_STAGE: $stage'" \
            < "$RUNNER_TEMP/water-pdf-deps.tar.gz"
          echo '### Locked Puppeteer dependencies staged privately' >> "$GITHUB_STEP_SUMMARY"
          echo 'No browser was downloaded or launched. Laravel and public_html were not modified.' >> "$GITHUB_STEP_SUMMARY"
