name: Subscription removal Flutter checks
on:
  push:
    branches:
      - 'remove-subscription-fees-*'
    paths:
      - 'mobile app/**'
      - '.github/workflows/subscription-fee-flutter-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'mobile app'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Flutter test
        run: flutter test --no-pub
