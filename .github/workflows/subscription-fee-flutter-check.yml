name: Subscription removal Flutter checks
on:
  push:
    branches:
      - main
      - 'remove-subscription-fees-*'
      - 'reading-boundaries-*'
    paths:
      - 'mobile app/**'
      - '.github/workflows/subscription-fee-flutter-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'mobile app'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart analyze
        run: flutter analyze --no-pub --no-fatal-infos
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, dom, fileinfo, curl, zip
          coverage: none
      - name: Install Laravel dependencies for cross-app localization contract tests
        working-directory: .
        run: |
          mkdir -p bootstrap/cache storage/framework/views storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/logs
          composer install --no-interaction --no-progress --prefer-dist
      - name: Flutter test
        run: flutter test --no-pub
