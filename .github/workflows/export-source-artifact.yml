name: Temporary Full Source Snapshot For Offline Audit
on:
  push:
    paths:
      - '.github/workflows/export-source-artifact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-export:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Export complete committed source
        run: |
          set -euo pipefail
          git archive --format=zip --output=water-main-source.zip HEAD
          unzip -tq water-main-source.zip
      - name: Keep archive briefly as protected workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-main-source
          path: water-main-source.zip
          retention-days: 1
