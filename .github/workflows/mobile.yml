name: Mobile test builds
on:
  push:
    branches: [arena/99b63ce7-water, arena/2a33faf4-water]
    paths: ['mobile app/**', '.github/workflows/mobile.yml', 'scripts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze (legacy lint warnings are reported, errors fail)
        run: python ../scripts/ci_analyze.py flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: mobile app/analyze.log
          if-no-files-found: ignore
          retention-days: 7
      - run: python ../scripts/ci_run.py flutter test --reporter expanded
      - name: Build testing APK (debug signing, runtime server setup)
        run: python ../scripts/ci_run.py flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/water-android-test.apk
          cd release
          sha256sum water-android-test.apk > SHA256SUMS.txt
      - name: Publish Android testing prerelease directly (no artifact quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-test-${{ github.run_number }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Water Android testing build ${{ github.run_number }}" \
            --notes-file RELEASE_NOTES.md \
            release/water-android-test.apk release/SHA256SUMS.txt
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python ../scripts/ci_run.py flutter build windows --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath water-windows-test.zip
      - name: Checksums
        shell: bash
        run: sha256sum water-windows-test.zip > SHA256SUMS.txt
      - name: Publish Windows testing prerelease directly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-test-${{ github.run_number }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Water Windows testing build ${{ github.run_number }}" \
            --notes-file RELEASE_NOTES.md \
            water-windows-test.zip SHA256SUMS.txt
