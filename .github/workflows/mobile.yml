name: Mobile test builds
on:
  push:
    branches: [arena/99b63ce7-water]
    paths: ['mobile app/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze (legacy lint warnings are reported, errors fail)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build testing APK (debug signing, runtime server setup)
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/water-android-test.apk
          cd release
          sha256sum water-android-test.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: mobile app/release/*
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath water-windows-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test
          path: mobile app/water-windows-test.zip
          if-no-files-found: error
  prerelease:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-test'
          merge-multiple: true
          path: release
      - name: Publish testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-test-${{ github.run_number }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Water mobile testing build ${{ github.run_number }}" \
            --notes-file 'mobile app/RELEASE_NOTES.md' \
            release/water-android-test.apk release/SHA256SUMS.txt release/water-windows-test.zip
