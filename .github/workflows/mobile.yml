name: Mobile test builds
on:
  push:
    # Build every active development branch (mainline + Arena working branches)
    # so integration fixes are verified before they reach a release branch.
    branches: [main, master, develop, 'arena/**']
    paths: ['mobile app/**', '.github/workflows/mobile.yml', 'scripts/ci_run.py']
  pull_request:
    paths: ['mobile app/**', '.github/workflows/mobile.yml', 'scripts/ci_run.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze (legacy lint warnings are reported, errors fail)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: python ../scripts/ci_run.py flutter test --reporter expanded
      - name: Build testing APK (debug signing, runtime server setup)
        run: python ../scripts/ci_run.py flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - name: Package
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/water-android-test.apk
          cd release
          sha256sum water-android-test.apk > SHA256SUMS.txt
      - name: Publish Android testing prerelease directly (no artifact quota)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-test-${{ github.run_number }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Water Android testing build ${{ github.run_number }}" \
            --notes-file RELEASE_NOTES.md \
            release/water-android-test.apk release/SHA256SUMS.txt
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze (errors fail, legacy lint warnings are reported)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: python ../scripts/ci_run.py flutter test --reporter expanded
      - run: python ../scripts/ci_run.py flutter build windows --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath water-windows-test.zip
      - name: Publish Windows testing prerelease directly
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "windows-test-${{ github.run_number }}" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Water Windows testing build ${{ github.run_number }}" \
            --notes-file RELEASE_NOTES.md water-windows-test.zip
