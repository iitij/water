name: Subscription fee retirement audit
on:
  push:
    branches:
      - main
      - 'remove-subscription-fees-*'
    paths:
      - 'app/**'
      - 'database/**'
      - 'routes/**'
      - 'resources/**'
      - 'mobile app/**'
      - '.github/workflows/subscription-removal-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-and-php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint all active Laravel PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app routes database resources tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l > /tmp/php-lint.log
          echo "PHP syntax checks: $(wc -l </tmp/php-lint.log)"
      - name: Inventory remaining retired fee references
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -i -E 'SubscriptionFee|subscription_fees|subscription_installment|subscriptionFee|sub_inv_|sub_show_|sub_lbl_|inv_show_sub_fee|inv_lbl_sub_fee|رسوم اشتراك|قسط الاشتراك' -- app routes database resources 'mobile app/lib' 'mobile app/test' tests || true
      - name: Block reintroduction of retired fee logic in active source
        shell: bash
        run: |
          set -euo pipefail
          # Historical identifiers are deliberately retained only inside
          # the offline upgraders that erase them from installed databases.
          if git grep -n -I -i -E 'SubscriptionFee|subscription[_-]?fees?|subscriptionInstallment|hasSubscriptionFee|initial_subscription_fee|subscription_fee_paid|is_subscription_fee_fully_paid|subscription_installment|has_subscription_fee|sub_inv_|sub_show_|sub_lbl_|inv_show_sub_fee|inv_lbl_sub_fee|رسوم[[:space:]]*الاشتراك|رسوم[[:space:]]*اشتراك|قسط[[:space:]]*الاشتراك|فاتورة[[:space:]]*الاشتراك|فاتورة[[:space:]]*اشتراك|InvoiceType[.]subscription|GenerateSubscriptionInvoice|subscriptionVariables|subscription[[:space:]]*=>|فواتير[[:space:]]*الاشتراك' -- app config routes resources database 'mobile app/lib' ':(exclude)database/migrations/2026_11_16_010000_final_subscription_fee_cleanup.php' ':(exclude)mobile app/lib/core/database/app_database.dart' ':(exclude)mobile app/lib/core/database/retired_cache_cleanup.dart'; then
            echo 'ERROR: retired subscription fee code returned to the active runtime.'
            exit 1
          fi


          # The feature's source directory must also stay deleted.
          if git ls-files app config routes resources 'mobile app/lib' |
            grep -E -i '(^|/)(subscription[-_]?fees?)(/|[.])'; then
            echo 'ERROR: subscription-fee source files reappeared.'
            exit 1
          fi

      - name: Inventory broader subscription wording for human review
        shell: bash
        run: |
          set -euo pipefail
          # "subscription" also legitimately describes when a subscriber joined.
          # This is an inventory, not a false-positive failure on membership dates.
          if git grep -n -I -i -E 'subscription|اشتراك' -- app config routes resources database 'mobile app/lib' > /tmp/subscription-reference-inventory.txt; then
            echo 'Subscription-word references by file:'
            cut -d: -f1 /tmp/subscription-reference-inventory.txt | sort | uniq -c | sort -rn
            echo 'Full audit references:'
            cat /tmp/subscription-reference-inventory.txt
          else
            echo 'No subscription-word references found.'
          fi

      - name: Inventory historical documentation and agent prompts
        shell: bash
        run: |
          set -euo pipefail
          # Find obsolete feature instructions in plans/agent prompts without
          # treating immutable historical test evidence as runnable features.
          if git grep -n -I -i -E 'SubscriptionFee|subscription[_-]?fees?|subscriptionInstallment|subscription[[:space:]]*=>|رسوم[[:space:]]*الاشتراك|رسوم[[:space:]]*اشتراك|فاتورة[[:space:]]*الاشتراك|فاتورة[[:space:]]*اشتراك|قسط[[:space:]]*الاشتراك' -- .claude docs AGENTS.md DEVELOPERS_MASTER_PROMPTS.md README.md FLUTTER_FOUNDATION_HANDOFF.md FLUTTER_MOBILE_MASTER_PLAN.md 'mobile app/README.md' 'mobile app/FEATURE_COVERAGE.md' > /tmp/retired-subscription-documentation.txt; then
            echo 'Obsolete-term documentation references by path:'
            cut -d: -f1 /tmp/retired-subscription-documentation.txt | sort | uniq -c | sort -rn
            echo 'Documentation reference details:'
            cat /tmp/retired-subscription-documentation.txt
          else
            echo 'No references to removed fee-domain concepts in the selected documentation.'
          fi
