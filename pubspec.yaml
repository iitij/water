name: water_mobile
description: "تطبيق الموبايل (Flutter) لنظام إدارة مشاريع المياه — الفواتير، التحصيل، سندات القبض، الطباعة والواتساب."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # === المعمارية وإدارة الحالة وحقن التبعيات (الخطة §3.1 / §3.2) ===
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  get_it: ^8.0.3
  dio: ^5.7.0
  go_router: ^14.6.2
  flutter_screenutil: ^5.9.3
  # === التخزين والأوفلاين ===
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.3.3
  # === الطباعة والـ PDF والواتساب (وحدة Dev 3) ===
  printing: ^5.13.4
  pdf: ^3.11.1
  share_plus: ^10.1.4
  open_filex: ^4.5.0
  print_bluetooth_thermal: ^1.1.1
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  # === الخط والوسائط ===
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
