name: water_project
publish_to: none
description: Flutter application for Water Project administration and field operations.
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.33.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  dio: ^5.8.0+1
  drift: ^2.21.0
  drift_flutter: ^0.2.0
  equatable: ^2.0.7
  fl_chart: ^0.69.2
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  get_it: ^8.0.3
  go_router: ^15.1.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  open_filex: ^4.5.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
